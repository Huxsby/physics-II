[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-robotics-project"
version = "0.1.0"
authors = [
  { name="HGP", email="hgp@example.com" },
]
description = "Un paquete para el análisis y simulación de robots de Física II."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "pyyaml",
    "imageio-ffmpeg",
    "sympy",
    "pandas"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[tool.setuptools.packages.find]
where = ["src"]